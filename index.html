<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#121212"><title>Context Maps</title><link rel="stylesheet" href="styles.css?v=51"></head>
<body>
 <main id="viewport" data-i18n-attr="aria-label:viewport" aria-label="Interactive map"><div id="world"><svg id="connections" aria-hidden="true"></svg><svg id="cross-links" aria-hidden="true"></svg><div id="nodes" role="tree" data-i18n-attr="aria-label:treeLabel"></div></div></main>
 <div id="doc-bar" class="doc-bar"><button id="doc-button" aria-haspopup="menu" aria-expanded="false"><span id="doc-title"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="save-status" role="status" aria-live="polite"></span><div id="doc-menu" role="menu" hidden><div id="doc-list"></div><button id="doc-new" type="button" role="menuitem" data-i18n="docNew"></button><button id="doc-addfolder" type="button" role="menuitem" data-i18n="docAddFolder"></button><button id="doc-saveas" type="button" role="menuitem" data-i18n="docSaveAs"></button><button id="doc-copy" type="button" role="menuitem" data-i18n="docCopy"></button><button id="doc-export-html" type="button" role="menuitem" data-i18n="exportHtml"></button><button id="doc-export-zip" type="button" role="menuitem" data-i18n="exportZip"></button><button id="doc-import" type="button" role="menuitem" data-i18n="importFile"></button><input id="import-input" type="file" accept=".zip,.html,.htm,application/zip,text/html" hidden><button id="doc-delete" type="button" role="menuitem" class="danger" data-i18n="docDelete"></button><div id="doc-version" aria-hidden="true"></div></div></div>
 <div id="drop-line" class="drop-line" hidden></div>
 <svg id="drop-link" class="drop-link" aria-hidden="true" hidden><path d="" fill="none"/></svg>
 <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-undo" type="button" data-i18n="undo"></button></div>
 <article id="reading" hidden></article>
 <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
 <div id="search-panel" class="search-panel" role="dialog" aria-modal="false" data-i18n-attr="aria-label:search" hidden><input id="search-input" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results" data-i18n-attr="placeholder:searchPlaceholder;aria-label:searchPlaceholder"><ul id="search-results" role="listbox"></ul><div id="search-empty" hidden data-i18n="searchEmpty"></div></div>
 <div class="zoom-controls" id="zoom-controls"><button id="zoom-out" data-i18n-attr="aria-label:zoomOut">−</button><output id="zoom-level">100%</output><button id="zoom-in" data-i18n-attr="aria-label:zoomIn">+</button><span></span><button id="fit" data-i18n-attr="aria-label:fit;title:fit">⌗</button></div>
 <nav class="toolbar" data-i18n-attr="aria-label:toolbar"><button id="edit-switch" class="switch" role="switch" aria-checked="false"><span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span><span data-i18n="edit"></span></button><button id="add-root" type="button" data-i18n-attr="aria-label:addRootLabel;title:addRootTitle"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2 6h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="rootCard"></span></button><div id="history-controls"><button id="undo-btn" type="button" disabled data-i18n-attr="aria-label:undo;title:undoTitle">↶</button><button id="redo-btn" type="button" disabled data-i18n-attr="aria-label:redo;title:redoTitle">↷</button></div><div id="tree-controls"><button id="expand"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7 1.5h3.5V5M5 10.5H1.5V7M10.5 1.5 7 5M1.5 10.5 5 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="expandAll"></span></button><button id="collapse"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M10.5 5H7V1.5M1.5 7H5v3.5M7 5l3.5-3.5M5 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="collapseAll"></span></button></div><button id="api-btn" type="button" aria-controls="api-panel" aria-expanded="false" data-i18n-attr="title:apiButtonTitle"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3.5 4.5 6 2 8.5M6 9h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="apiButton"></span></button><button id="search-btn" type="button" aria-haspopup="dialog" data-i18n-attr="aria-label:search;title:searchTitle"><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m7.6 7.6 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="search"></span></button><button id="fullscreen" aria-pressed="false" data-i18n-attr="title:fullscreen"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 4.5v-3h3M7.5 1.5h3v3M10.5 7.5v3h-3M4.5 10.5h-3v-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="fullscreen-label" data-i18n="fullscreen"></span></button><button id="mode" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 3h9M1.5 6h9M1.5 9h9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span id="mode-label" data-i18n="textMode"></span></button></nav>
 <dialog data-i18n-attr="aria-label:lightbox"><button id="close-dialog" data-i18n-attr="aria-label:closeImage">×</button><button id="lightbox-prev" data-i18n-attr="aria-label:prevImage" hidden>‹</button><button id="lightbox-next" data-i18n-attr="aria-label:nextImage" hidden>›</button><span id="lightbox-count" hidden></span><img src="city.svg" alt=""><p></p></dialog>
 <div id="saveas-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="saveas-heading" hidden>
  <div class="modal-card saveas-card">
   <header><h2 id="saveas-heading" data-i18n="saveAs"></h2><button id="saveas-close" type="button" data-i18n-attr="aria-label:close">×</button></header>
   <form id="saveas-form" class="saveas-body" autocomplete="off">
    <label><span data-i18n="presName"></span><input id="saveas-name" type="text" maxlength="120" required></label>
    <label><span data-i18n="folder"></span><select id="saveas-folder"></select></label>
    <div id="saveas-custom" class="saveas-custom" hidden>
     <input id="saveas-path" type="text" data-i18n-attr="aria-label:folderPath;placeholder:pathPlaceholder">
     <button id="saveas-pick" type="button" data-i18n="choose"></button>
    </div>
    <fieldset>
     <label class="saveas-radio"><input type="radio" name="saveas-mode" value="open" checked> <span data-i18n="openNew"></span></label>
     <label class="saveas-radio"><input type="radio" name="saveas-mode" value="stay"> <span data-i18n="stayHere"></span></label>
    </fieldset>
    <div id="saveas-error" role="alert"></div>
   </form>
   <footer><button id="saveas-cancel" type="button" data-i18n="cancel"></button><button id="saveas-submit" type="submit" form="saveas-form" data-i18n="save"></button></footer>
  </div>
 </div>
 <div id="diagram-editor" class="modal" role="dialog" aria-modal="true" aria-labelledby="diagram-heading" hidden>
  <div class="modal-card">
   <header><h2 id="diagram-heading" data-i18n="diagramTitle"></h2><select id="diagram-template" data-i18n-attr="aria-label:diagramTemplate" hidden></select><button id="diagram-visual" type="button" data-i18n="seqEdVisualButton" hidden></button><button id="diagram-cancel" type="button" data-i18n-attr="aria-label:closeDiagram">×</button></header>
   <div class="modal-body"><textarea id="diagram-source" spellcheck="false" data-i18n-attr="aria-label:mermaidCode"></textarea><div id="diagram-preview" aria-live="polite"></div></div>
   <footer><span id="diagram-error" role="alert"></span><span id="diagram-engine"></span><button id="diagram-apply" type="button" data-i18n="apply"></button></footer>
  </div>
 </div>
 <script type="module" src="app.js?v=82"></script>
</body></html>
