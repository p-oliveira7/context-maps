<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141514"><title>Cidades para pessoas · Response Maps</title><link rel="stylesheet" href="styles.css"></head>
<body>
 <header><a class="brand" href="./" aria-label="Response Maps, início"><span class="brand-icon">✳</span> response<span>maps</span></a><div class="edition"><span class="status-dot"></span> ESTUDO 001 <span class="divider">/</span> CIDADES POSSÍVEIS</div><span class="version">PRÉVIA v0.1</span></header>
 <main id="viewport" aria-label="Mapa interativo: arraste o fundo para navegar"><div id="world"><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div></main>
 <article id="reading" hidden></article>
 <div class="map-meta" id="map-meta"><span class="eyebrow">UM MAPA PARA EXPLORAR</span><span id="counter" aria-live="polite"></span></div>
 <div class="zoom-controls" id="zoom-controls"><button id="zoom-out" aria-label="Diminuir zoom">−</button><output id="zoom-level">100%</output><button id="zoom-in" aria-label="Aumentar zoom">+</button><span></span><button id="fit" aria-label="Enquadrar mapa" title="Enquadrar mapa">⌗</button></div>
 <nav class="toolbar" aria-label="Controles do mapa"><div id="tree-controls"><button id="expand">Expandir tudo <span aria-hidden="true">↗</span></button><button id="collapse">Recolher tudo <span aria-hidden="true">↙</span></button></div><button id="mode" aria-pressed="false"><span aria-hidden="true">≡</span> Modo texto</button></nav>
 <footer id="hint">Arraste para explorar <span>·</span> Role para aproximar <span>·</span> Clique em + para descobrir</footer>
 <dialog aria-label="Ilustração da cidade"><button id="close-dialog" aria-label="Fechar imagem">×</button><img src="city.svg" alt="Ilustração original de uma cidade verde, com edifícios, árvores, sol e caminhos"><p>Cidades possíveis — ilustração original</p></dialog>
 <script type="module" src="app.js"></script>
</body></html>
