name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # O app não tem dependências; só os testes de navegador usam o playwright-core (com o Chrome já instalado no runner).
      - name: Install test tooling
        run: npm install --no-save --no-package-lock playwright-core@1
      - name: Model tests
        run: npm test
      - name: Browser and skill tests
        run: npm run test:e2e
